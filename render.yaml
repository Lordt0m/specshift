services:
  - type: web
    name: specshift-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn api.config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 20 --max-requests 100 --max-requests-jitter 20 --error-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: specshift-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://specshift.pages.dev
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PUBLIC_COMPARE_ENABLED
        value: "true"
