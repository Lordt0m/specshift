name: SpecShift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      - name: Run Python tests
        run: |
          pytest api/tests
      - name: Check dependencies and source credential patterns
        run: |
          python -m pip check
          python scripts/check_secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd web
          npm ci
      - name: Build frontend
        run: |
          cd web
          npm run build
      - name: Audit runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
